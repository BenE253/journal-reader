<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover lets content extend into the iPhone notch area;
       safe-area padding in CSS keeps it readable. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f6f5c">
  <title>{% block title %}PaperShelf{% endblock %}</title>
  {# Loaded before the stylesheet so a saved light/dark override applies
     before first paint (avoids a theme flash on every page load). #}
  <script src="/static/theme.js"></script>
  <link rel="stylesheet" href="/static/style.css">
  {% block head %}{% endblock %}
</head>
<body class="{% block bodyclass %}{% endblock %}">
  {% block content %}{% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
